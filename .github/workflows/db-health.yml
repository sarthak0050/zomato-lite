name: Database Health & Demo Seed

# Keeps the Zomato Lite database healthy and the demo dataset present.
# - Runs weekly (Mon 06:00 UTC) and on demand via "Run workflow".
# - Connects with DATABASE_URL (repo secret), verifies the schema, and
#   idempotently seeds the demo restaurant/reviews only when they are missing
#   (it never drops tables or touches user-written reviews).
#
# It does not commit code: the effect lives in the Neon database. A red run
# means the DB needs attention (missing DATABASE_URL secret, schema issue,
# or the Neon instance is down).

on:
  schedule:
    - cron: '37 6 * * 1' # Mondays, 06:37 UTC
  workflow_dispatch:

concurrency:
  group: db-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DATABASE_URL secret is configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured yet. Skipping the health check. Add it at:"
            echo "  https://github.com/sarthak0050/zomato-lite/settings/secrets/actions"
            echo "  (name: DATABASE_URL, value: your Neon connection string)"
          fi

      - name: Run review job (non-destructive health + seed)
        if: env.DATABASE_URL != ''
        run: npx tsx scripts/review-job.ts --mode once